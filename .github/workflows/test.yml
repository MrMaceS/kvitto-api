name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kvitto_test
          POSTGRES_PASSWORD: kvitto_test
          POSTGRES_DB: kvitto_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Run tests
      env:
        # Используем имя сервиса 'postgres' и порт 5432 (внутренний порт контейнера)
        DATABASE_URL: postgresql+asyncpg://kvitto_test:kvitto_test@postgres:5432/kvitto_test
        PYTHONPATH: .
      run: |
        pytest tests/ -v